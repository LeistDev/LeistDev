name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download profile renderer
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/metawka/expressive-profile/v1/action/render.mjs --output /tmp/expressive-profile-render.mjs
      - name: Render profile
        run: node /tmp/expressive-profile-render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Remove generator footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          credit = "Made with " + "Expressive Profile"
          lines = [line for line in readme.read_text().splitlines() if credit not in line]
          readme.write_text("\n".join(lines).rstrip() + "\n")
          PY
          rm -f assets/credit-light.svg assets/credit-dark.svg
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
